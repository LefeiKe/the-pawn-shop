<!doctype html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vase Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- include the p5 core library using the CDN -->
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>

    <!-- your custom sketch code -->
    <script src="sketch.js"></script>

    <!-- custom CSS styles for this page -->
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            width: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #ead09f;
            font-family: "Pixelify Sans", sans-serif;
        }

        canvas {
            display: block;
            height: auto !important;
            width: 100% !important;
            image-rendering: pixelated;
        }
    </style>

</head>

<body>
    <script>
      // Mini-game canvases run in iframes, so their clicks need their own sound.
      const miniClick = new Audio("../sounds/click.mp3");
      function playMiniClick() {
        miniClick.currentTime = 0;
        miniClick.play().catch(() => {});
      }
      const miniFlip = new Audio("../sounds/bookflip.mp3");
      function playMiniFlip() {
        miniFlip.currentTime = 0;
        miniFlip.play().catch(() => {});
      }
      window.addEventListener("message", event => {
        if (event.source !== window.parent || event.origin !== window.location.origin ||
            event.data?.type !== "shopAudioMute") return;
        const muted = event.data.muted === true;
        for (const sound of [miniClick, miniFlip]) sound.muted = muted;
      });
    </script>
</body>

</html>
