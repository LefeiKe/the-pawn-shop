<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Storage Tetris</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>
</head>

<body style="margin: 0;">
    <div id="game"></div>

    <script src="sketch.js"></script>

    <script>
      // Mini-game canvases run in iframes, so their clicks need their own sound.
      const miniClick = new Audio("../sounds/click.mp3");
      miniClick.volume = 0.45;
      document.addEventListener("pointerdown", (event) => {
        if (event.target.tagName !== "CANVAS") return;
        miniClick.currentTime = 0;
        miniClick.play().catch(() => {});
      });
    </script>
</body>

</html>
