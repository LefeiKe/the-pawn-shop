<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Storage Tetris</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>
    <style>
      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #000;
        color: #ead09f;
        font-family: "Pixelify Sans", sans-serif;
      }
      #game {
        width: 864px;
        height: 576px;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
    </style>
</head>

<body>
    <div id="game"></div>

    <script src="sketch.js"></script>

    <script>
      // Mini-game canvases run in iframes, so their clicks need their own sound.
      const miniClick = new Audio("../sounds/click.mp3");
      function playMiniClick() {
        miniClick.currentTime = 0;
        miniClick.play().catch(() => {});
      }
      const miniLineClear = new Audio("../sounds/lineclear.mp3");
      function playMiniLineClear() {
        miniLineClear.currentTime = 0;
        miniLineClear.play().catch(() => {});
      }
    </script>
</body>

</html>
