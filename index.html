
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pixel Pat's Pawns and Parcels</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>
    <style>
        #game {
            height: 576px;
            position: relative;
            width: 864px;
        }

        #posh-game-overlay[hidden],
        #tetris-game-overlay[hidden],
        #memory-game-overlay[hidden] {
            display: none;
        }

        #posh-game-overlay,
        #tetris-game-overlay,
        #memory-game-overlay {
            align-items: center;
            background: rgba(0, 0, 0, 0.78);
            box-sizing: border-box;
            display: flex;
            height: 100%;
            justify-content: center;
            left: 0;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
        }

        #posh-game-window,
        #tetris-game-window,
        #memory-game-window {
            background: #ead0a1;
            border: 8px solid #3c261c;
            box-sizing: border-box;
            box-shadow: 0 0 0 4px #8c5b38;
            height: 470px;
            padding: 14px;
            position: relative;
            width: 684px;
        }

        #posh-game-frame,
        #tetris-game-frame,
        #memory-game-frame {
            border: 0;
            display: block;
            height: 100%;
            width: 100%;
        }

        /* Memory game covers the shop; its 800 x 500 canvas is centered inside. */
        #memory-game-window {
            width: 100%;
            height: 100%;
            padding: 0;
            border: 0;
            box-shadow: none;
            background: #000;
        }

        #memory-game-frame {
            width: 100%;
            height: 100%;
        }

        /* Abdullah's 864 x 576 canvas already fills the shop viewport. */
        #tetris-game-window {
            width: 864px;
            height: 576px;
            padding: 0;
            border: 0;
            box-shadow: none;
        }

        #tetris-game-frame {
            width: 864px;
            height: 576px;
        }

        /* Margot's puzzle fills the same frameless 864 x 576 shop cover. */
        #posh-game-window {
            width: 864px;
            height: 576px;
            padding: 0;
            border: 0;
            box-shadow: none;
            background: #000;
        }

        #posh-game-frame {
            width: 100%;
            height: 100%;
        }

        #close-posh-game {
            background: #9c3f34;
            border: 0;
            color: #fff;
            cursor: pointer;
            font-family: "Pixelify Sans", sans-serif;
            font-size: 16px;
            padding: 8px 14px;
            position: absolute;
            right: 14px;
            top: 14px;
            z-index: 1;
        }
    </style>

    <style>
        html, body {
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #ead09f;
            font-family: "Pixelify Sans", sans-serif;
        }
    
        canvas {
            display: block;
            image-rendering: pixelated;
        }

        .page-shell {
            width: 864px;
            max-width: 100%;
            padding: 24px 0;
            text-align: center;
        }

        .page-title {
            margin: 0 0 4px;
            color: #e6bf73;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .page-tagline {
            margin: 0 0 18px;
            color: #d0a06e;
            font-size: 18px;
        }

        .page-hint {
            margin: 16px 0 0;
            color: #ead09f;
            font-size: 17px;
        }
    </style>
    
</head>

<body>
    <main class="page-shell">
      <header>
        <h1 class="page-title">Pixel Pat's Pawns and Parcels</h1>
        <p class="page-tagline">Be prudent and profitable to help the little shop prosper.</p>
      </header>
    <div id="game">
        <div id="posh-game-overlay" hidden>
            <div id="posh-game-window">
                <button id="close-posh-game" type="button">CLOSE GAME</button>
                <iframe id="posh-game-frame" data-src="vase-puzzle/index.html"
                    title="Posh patron vase puzzle game"></iframe>
            </div>
        </div>

        <!-- No close button: the player has to finish or give up inside the game. -->
        <div id="tetris-game-overlay" hidden>
            <div id="tetris-game-window">
                <iframe id="tetris-game-frame" data-src="storage-tetris/index.html"
                    title="Storage Reorganization challenge"></iframe>
            </div>
        </div>

        <!-- Inspector Memory Game: anchored to the shop canvas. -->
        <div id="memory-game-overlay" hidden>
            <div id="memory-game-window">
                <iframe
                    id="memory-game-frame"
                    data-src="memory-mini-game/memory-index.html"
                    title="Inspector Memory Game">
                </iframe>
            </div>
        </div>
    </div>
      <p class="page-hint">Buy low, sell high, and make your shop prosper in 28 days!</p>
    </main>

    <script src="sketch.js"></script>

</body>

</html>
