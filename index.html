
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mini Pawn Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>
    <style>
        #game {
            height: 576px;
            position: relative;
            width: 864px;
        }

        #posh-game-overlay[hidden],
        #tetris-game-overlay[hidden],
        #memory-game-overlay[hidden] {
            display: none;
        }

        #posh-game-overlay,
        #tetris-game-overlay,
        #memory-game-overlay {
            align-items: center;
            background: rgba(0, 0, 0, 0.78);
            box-sizing: border-box;
            display: flex;
            height: 100%;
            justify-content: center;
            left: 0;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
        }

        #posh-game-window,
        #tetris-game-window,
        #memory-game-window {
            background: #ead0a1;
            border: 8px solid #3c261c;
            box-sizing: border-box;
            box-shadow: 0 0 0 4px #8c5b38;
            height: 470px;
            padding: 14px;
            position: relative;
            width: 684px;
        }

        #posh-game-frame,
        #tetris-game-frame,
        #memory-game-frame {
            border: 0;
            display: block;
            height: 100%;
            width: 100%;
        }

        /* Memory Game uses an 800 x 500 canvas */
        #memory-game-frame {
            width: 800px;
            height: 500px;
        }

        #close-posh-game {
            background: #9c3f34;
            border: 0;
            color: #fff;
            cursor: pointer;
            font-family: "Pixelify Sans", sans-serif;
            font-size: 16px;
            padding: 8px 14px;
            position: absolute;
            right: 14px;
            top: 14px;
            z-index: 1;
        }
    </style>

    <style>
        body {
            margin: 0;
        }
    
        canvas {
            display: block;
        }
    </style>
    
</head>

<body>
    <div id="game">
        <div id="posh-game-overlay" hidden>
            <div id="posh-game-window">
                <button id="close-posh-game" type="button">CLOSE GAME</button>
                <iframe id="posh-game-frame" data-src="vasePuzzle/index.html"
                    title="Posh patron vase puzzle game"></iframe>
            </div>
        </div>
    </div>

    <!-- No close button: the player has to finish or give up inside the game. -->
    <div id="tetris-game-overlay" hidden>
        <div id="tetris-game-window">
            <iframe id="tetris-game-frame" data-src="storage-tetris/index.html"
                title="Storage Reorganization challenge"></iframe>
        </div>
    </div>

    <!-- Inspector Memory Game -->
    <div id="memory-game-overlay" hidden>
        <div id="memory-game-window">
            <iframe
                id="memory-game-frame"
                data-src="memory-mini-game/memory-index.html"
                title="Inspector Memory Game">
            </iframe>
        </div>
    </div>
    
    <script src="sketch.js"></script>

</body>

</html>
